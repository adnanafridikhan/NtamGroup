<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Live Voting - Nestlé Medical Congress</title><link rel="stylesheet" href="voting.css">
<link rel="stylesheet" href="android.css"><script src="detail.js" defer></script>
<style data-purpose="custom-styling">
    /* Subtle curved line visual effect on dark navy background */
    .bg-curved-lines {
      background-image: radial-gradient(circle at 100% 15%, rgba(0, 102, 245, 0.15) 0%, transparent 60%),
                        radial-gradient(circle at 0% 45%, rgba(0, 181, 245, 0.1) 0%, transparent 50%);
    }

    /* iOS Home Indicator Bar */
    .home-indicator {
      width: 134px;
      height: 5px;
      border-radius: 9999px;
      background-color: #000000;
    }
  </style>
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen p-0 sm:p-4 selection:bg-brand-primary selection:text-white" data-screen="voting">
<!-- BEGIN: PhoneContainer -->
<!-- Constrained mobile device shell with rounded corners and iOS frame styling -->
<div class="relative w-full max-w-[390px] h-[844px] bg-brand-midnight text-white flex flex-col justify-between overflow-hidden shadow-2xl sm:rounded-[48px] border-0 sm:border-[8px] sm:border-slate-800" data-purpose="mobile-viewport">

<!-- Scrollable Body Content Wrapper -->
<div class="flex-1 flex flex-col justify-between overflow-y-auto bg-curved-lines z-20">
<!-- BEGIN: TopBarSection -->
<div class="px-5 pt-3">
<!-- Navigation Bar -->
<nav class="flex items-center justify-between" data-purpose="app-bar">
<!-- Back Button -->
<button aria-label="Go Back" class="w-10 h-10 rounded-2xl bg-white/10 backdrop-blur-md border border-white/15 flex items-center justify-center text-white active:scale-95 transition-transform">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Screen Title -->
<h1 class="text-xl font-bold tracking-tight text-white">Live Voting</h1>
<!-- Right Action: Ballot Box Icon Button -->
<button aria-label="Voting Options" class="w-10 h-10 rounded-2xl bg-white/10 backdrop-blur-md border border-white/15 flex items-center justify-center text-amber-400 active:scale-95 transition-transform">
<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0l-2 7H6l-2-7m16 0H4m10-5l-2-2m0 0l-2 2m2-2v5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</nav>
<!-- BEGIN: AudienceInteractionBanner -->
<!-- Frosted Dark Banner with Graphic Icon -->
<div class="mt-4 p-3.5 rounded-3xl bg-brand-navyCard/60 border border-white/10 backdrop-blur-xl flex items-center space-x-3.5" data-purpose="audience-interaction-card">
<!-- Amber/Orange Equalizer Graphic Icon -->
<div class="w-14 h-14 rounded-2xl bg-gradient-to-b from-amber-400 to-orange-500 flex items-center justify-center space-x-1 shadow-md shrink-0">
<span class="w-1.5 h-4 bg-white rounded-full"></span>
<span class="w-1.5 h-7 bg-white rounded-full"></span>
<span class="w-1.5 h-3.5 bg-white rounded-full"></span>
</div>
<!-- Banner Copy -->
<div class="pr-2">
<h2 class="text-base font-bold text-white leading-tight">Audience Interaction</h2>
<p class="text-xs text-slate-300 font-normal mt-1 leading-snug">
              Swipe polls, choose answers, and submit your vote
            </p>
</div>
</div>
<!-- END: AudienceInteractionBanner -->
</div>
<!-- END: TopBarSection -->
<!-- BEGIN: PollCardContainer -->
<!-- Elevated White Card for Active Voting Poll -->
<main class="mt-4 bg-white rounded-t-[36px] px-6 pt-3.5 pb-2 text-brand-textDark shadow-card flex flex-col justify-between flex-1" data-purpose="poll-content-card">
<div>
<!-- Poll navigation -->
<div class="flex justify-center items-center space-x-1.5 pb-3" aria-label="Choose a poll">
<button type="button" data-poll-index="0" aria-label="Question 1 of 3"></button>
<button type="button" data-poll-index="1" aria-label="Question 2 of 3"></button>
<button type="button" data-poll-index="2" aria-label="Question 3 of 3"></button>
</div>
<!-- Status Badge & Category -->
<div class="flex items-center space-x-2.5 mt-1">
<span data-poll-status class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold tracking-wide uppercase bg-amber-100 text-amber-600">VOTED</span>
<span class="text-xs font-semibold text-slate-500">Audience Feedback</span>
</div>
<!-- Main Question Header -->
<h2 aria-live="polite" class="text-[20px] font-extrabold leading-snug text-[#071638] mt-3">
            How would you rate the current session?
          </h2>
<p class="text-xs text-brand-muted font-medium mt-1">101 total votes</p>
<!-- BEGIN: VotingOptionsList -->
<div class="mt-4 space-y-3">
<!-- Option 1: Excellent (54%) -->
<div class="p-3.5 rounded-2xl border border-slate-200 bg-white" data-purpose="poll-option-item">
<div class="flex items-center justify-between">
<div class="flex items-center space-x-3">
<!-- Unselected Radio Circle -->
<div class="w-6 h-6 rounded-full border-2 border-slate-200"></div>
<span class="font-bold text-sm text-[#071638]">Excellent</span>
</div>
<span class="font-extrabold text-sm text-brand-primary">54%</span>
</div>
<!-- Progress Bar -->
<div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden mt-2.5">
<div class="bg-brand-cyan h-full rounded-full" style="width: 54%;"></div>
</div>
<p class="text-[11px] text-right text-slate-400 font-medium mt-1">55 votes</p>
</div>
<!-- Option 2: Very Good (31% - Active Selection) -->
<div class="p-3.5 rounded-2xl border-2 border-brand-primary bg-blue-50/20 shadow-sm relative" data-purpose="poll-option-item-selected">
<div class="flex items-center justify-between">
<div class="flex items-center space-x-3">
<!-- Selected Checked Circle -->
<div class="w-6 h-6 rounded-full bg-brand-primary flex items-center justify-center text-white">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="font-bold text-sm text-[#071638]">Very Good</span>
</div>
<span class="font-extrabold text-sm text-brand-primary">31%</span>
</div>
<!-- Amber Progress Bar -->
<div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden mt-2.5">
<div class="bg-brand-amber h-full rounded-full" style="width: 31%;"></div>
</div>
<p class="text-[11px] text-right text-slate-400 font-medium mt-1">31 votes</p>
</div>
<!-- Option 3: Good (10% - Partial View) -->
<div class="p-3 rounded-2xl border border-slate-200 bg-white" data-purpose="poll-option-item">
<div class="flex items-center justify-between">
<div class="flex items-center space-x-3">
<div class="w-6 h-6 rounded-full border-2 border-slate-200"></div>
<span class="font-bold text-sm text-[#071638]">Good</span>
</div>
<span class="font-extrabold text-sm text-brand-primary">10%</span>
</div>
</div>
</div>
<!-- END: VotingOptionsList -->
</div>
<!-- BEGIN: ActionControls -->
<!-- Navigation Controls: Prev, Next Poll CTA, and Next Button -->
<div class="pt-3 pb-1 flex items-center justify-between gap-3" data-purpose="bottom-controls">
<!-- Previous Poll Button -->
<button aria-label="Previous Poll" class="w-12 h-12 rounded-2xl border border-slate-200 bg-white text-brand-primary flex items-center justify-center shadow-nav-btn active:scale-95 transition-transform shrink-0">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Primary "Next Poll" CTA Button -->
<button class="flex-1 h-12 rounded-2xl bg-gradient-to-r from-[#0062f2] to-[#007cf5] text-white font-bold text-base shadow-btn-blue flex items-center justify-center active:scale-[0.98] transition-transform">
            Next Poll
          </button>
<!-- Next Poll Arrow Button -->
<button aria-label="Next Poll Preview" class="w-12 h-12 rounded-2xl border border-slate-200 bg-white text-brand-primary flex items-center justify-center shadow-nav-btn active:scale-95 transition-transform shrink-0">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- END: ActionControls -->

</main>
<!-- END: PollCardContainer -->
</div>
</div>
<!-- END: PhoneContainer -->
</body></html>
