<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Congress Agenda</title><link rel="stylesheet" href="agenda.css">
<link rel="stylesheet" href="android.css"><script src="detail.js" defer></script>
<style data-purpose="custom-decorations">
    /* Subtle dot grid pattern */
    .bg-dot-pattern {
      background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
      background-size: 16px 16px;
    }
    
    /* Background wave contours */
    .bg-topo-lines {
      background: radial-gradient(circle at 100% 20%, rgba(26, 68, 140, 0.35) 0%, transparent 55%),
                  radial-gradient(circle at 0% 0%, rgba(14, 165, 233, 0.15) 0%, transparent 40%);
    }

    /* Hide scrollbar for category pills horizontal scroll */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-0 sm:p-4 text-slate-800 antialiased font-sans" data-screen="agenda">
<!-- BEGIN: PhoneContainer -->
<!-- Outer shell simulating iPhone frame -->
<main class="w-full max-w-[390px] h-[844px] bg-[#071630] rounded-[50px] shadow-[0_25px_60px_-15px_rgba(0,0,0,0.7)] flex flex-col relative overflow-hidden border-[8px] border-[#1e293b]">


<!-- Congress Agenda Top Navigation Bar -->
<!-- BEGIN: TopBar -->
<div class="relative z-20 px-5 pt-3 pb-2 flex items-center justify-between">
<!-- Back Button -->
<button aria-label="Go Back" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/15 backdrop-blur-md flex items-center justify-center text-white border border-white/10 active:scale-95 transition-all" type="button">
<svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Center Title -->
<h1 class="text-xl font-bold tracking-tight text-white drop-shadow-sm">Congress Agenda</h1>
<!-- Search Button -->
<button aria-label="Search" aria-controls="agenda-search" aria-expanded="false" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/15 backdrop-blur-md flex items-center justify-center text-white border border-white/10 active:scale-95 transition-all" type="button">
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1116.65 6.65a7.5 7.5 0 010 10.6z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- END: TopBar --><input id="agenda-search" data-agenda-search type="search" aria-label="Search sessions" placeholder="Search sessions, speakers or venues" hidden>
<!-- Deep Blue Background Decor Elements -->
<div class="absolute inset-0 top-0 h-80 bg-topo-lines pointer-events-none"></div>
<div class="absolute top-12 left-5 w-24 h-24 bg-dot-pattern opacity-40 pointer-events-none"></div>
<!-- BEGIN: ScheduleOverviewSection -->
<div class="relative z-10 px-5 pt-2 pb-4 space-y-3">
<!-- Day 1 Schedule Floating Frosted Card -->
<div class="w-full bg-white/[0.07] border border-white/15 backdrop-blur-xl rounded-2xl p-3.5 flex items-center space-x-3.5 shadow-lg shadow-black/20">
<!-- Calendar Icon Badge -->
<div class="w-13 h-13 p-2.5 rounded-2xl bg-gradient-to-br from-[#ffb834] to-[#f59e0b] shadow-md flex items-center justify-center shrink-0">
<svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<circle cx="8.5" cy="14.5" fill="currentColor" r="1"></circle>
<circle cx="12" cy="14.5" fill="currentColor" r="1"></circle>
<circle cx="15.5" cy="14.5" fill="currentColor" r="1"></circle>
</svg>
</div>
<!-- Card Text Info -->
<div>
<h2 data-agenda-heading class="text-white text-[17px] font-bold tracking-tight">Day 1 Schedule</h2>
<p data-agenda-date class="text-slate-300/80 text-xs font-medium tracking-normal mt-0.5">Friday, May 22, 2026</p>
</div>
</div>
<!-- Day Selector Dual Tabs -->
<div class="grid grid-cols-2 gap-3 pt-1">
<!-- Day 1 -->
<button data-agenda-day="1" aria-pressed="true" class="w-full bg-[#f6b84f] text-[#0f244a] rounded-2xl py-2.5 px-3 flex flex-col items-center justify-center shadow-md active:opacity-90 transition" type="button">
<span class="text-sm font-extrabold tracking-wide leading-tight">Day 1</span>
<span class="text-[11px] font-semibold opacity-90 leading-tight mt-0.5">May 22</span>
</button>
<!-- Inactive Tab: Day 2 -->
<button data-agenda-day="2" aria-pressed="false" class="w-full bg-[#122b55]/80 hover:bg-[#122b55] text-slate-300 rounded-2xl py-2.5 px-3 flex flex-col items-center justify-center border border-white/10 transition active:opacity-90" type="button">
<span class="text-sm font-bold tracking-wide leading-tight">Day 2</span>
<span class="text-[11px] font-medium leading-tight mt-0.5">May 23</span>
</button>
</div>
</div>
<!-- END: ScheduleOverviewSection -->
<!-- BEGIN: TodaySessionsContentSheet -->
<!-- White Content Bottom Sheet Card -->
<div class="flex-1 bg-white rounded-t-[32px] shadow-2xl overflow-y-auto no-scrollbar relative z-20 px-5 pt-5 pb-8 flex flex-col">
<!-- Section Header with Reset Button -->
<div class="flex items-center justify-between mb-3.5">
<h3 class="text-[19px] font-extrabold tracking-tight text-[#0a1e3f]">Today's Sessions</h3>
<!-- Reset Button -->
<button data-agenda-reset class="flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-slate-50 text-[#0062eb] hover:bg-slate-100 font-bold text-xs tracking-wide transition border border-blue-50" type="button">
<svg class="w-3.5 h-3.5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Reset</span>
</button>
</div>
<!-- Filter Category Pills Horizontal Row -->
<div data-agenda-filter class="flex items-center space-x-2 overflow-x-auto no-scrollbar pb-1 mb-3 shrink-0">
<!-- 'All' Pill (Active) -->
<button class="px-5 py-1.5 rounded-full bg-[#0062eb] text-white text-xs font-bold shadow-sm shadow-blue-500/20 active:scale-95 transition shrink-0" type="button">
          All
        </button>
<!-- 'Keynote' Pill -->
<button class="px-4 py-1.5 rounded-full bg-white border border-slate-200 text-slate-600 hover:text-slate-800 text-xs font-bold active:scale-95 transition shrink-0" type="button">
          Keynote
        </button>
<!-- 'Nutrition' Pill -->
<button class="px-4 py-1.5 rounded-full bg-white border border-slate-200 text-slate-600 hover:text-slate-800 text-xs font-bold active:scale-95 transition shrink-0" type="button">
          Nutrition
        </button>
<!-- 'Research' Pill -->
<button class="px-4 py-1.5 rounded-full bg-white border border-slate-200 text-slate-600 hover:text-slate-800 text-xs font-bold active:scale-95 transition shrink-0" type="button">
          Research
        </button>
</div>
<!-- Session Cards Stack -->
<div class="space-y-3.5 flex-1">
<!-- BEGIN: SessionCard1 -->
<article data-day="1" data-agenda-category="Keynote" data-session="opening-ceremony" class="bg-white rounded-2xl p-3.5 border border-amber-300/80 shadow-[0_4px_16px_rgba(245,158,11,0.08)] flex items-center justify-between relative group hover:shadow-md transition">
<!-- Left: Time Block -->
<div class="w-14 flex flex-col items-start pr-1 shrink-0">
<span class="text-[#0052cc] font-extrabold text-[15px] leading-tight">08:30</span>
<span class="text-slate-400 text-[10px] font-bold mt-0.5 tracking-wider uppercase">AM</span>
</div>
<!-- Middle-Left: Icon Badge -->
<div class="w-11 h-11 rounded-2xl bg-[#fff9ed] border border-[#fef08a] flex items-center justify-center shrink-0 mr-3">
<svg class="w-5 h-5 text-[#f59e0b]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<!-- Middle-Right: Content Detail -->
<div class="flex-1 min-w-0 pr-2">
<span class="text-[10px] font-extrabold text-[#f59e0b] tracking-wider uppercase block">KEYNOTE</span>
<h4 class="text-[13px] font-bold text-[#091e42] truncate leading-snug">Opening Ceremony</h4>
<div class="flex items-center text-slate-400 text-[11px] font-medium mt-0.5 truncate">
<svg class="w-3 h-3 text-slate-400 mr-1 shrink-0" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="truncate">Main Auditorium</span>
</div>
</div>
<!-- Right: Bookmark Icon -->
<button aria-label="Bookmark Opening Ceremony" class="text-slate-400 hover:text-slate-600 p-1.5 shrink-0" type="button">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</article>
<!-- END: SessionCard1 -->
<!-- BEGIN: SessionCard2 -->
<article data-day="1" data-agenda-category="Keynote" data-session="welcome-introduction" class="bg-white rounded-2xl p-3.5 border border-slate-100 shadow-[0_4px_16px_rgba(0,0,0,0.04)] flex items-center justify-between relative group hover:shadow-md transition">
<!-- Left: Time Block -->
<div class="w-14 flex flex-col items-start pr-1 shrink-0">
<span class="text-[#0052cc] font-extrabold text-[15px] leading-tight">09:30</span>
<span class="text-slate-400 text-[10px] font-bold mt-0.5 tracking-wider uppercase">AM</span>
</div>
<!-- Middle-Left: Icon Badge (Microphone) -->
<div class="w-11 h-11 rounded-2xl bg-[#e1f5fe] flex items-center justify-center shrink-0 mr-3">
<svg class="w-5 h-5 text-[#0288d1]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<!-- Middle-Right: Content Detail -->
<div class="flex-1 min-w-0 pr-2">
<span class="text-[10px] font-extrabold text-[#0062eb] tracking-wider uppercase block">KEYNOTE</span>
<h4 class="text-[13px] font-bold text-[#091e42] leading-snug">Welcome &amp; Introduction</h4>
<div class="flex items-center text-slate-400 text-[11px] font-medium mt-0.5 truncate">
<svg class="w-3 h-3 text-slate-400 mr-1 shrink-0" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="truncate">Dr. Hassan Ali</span>
</div>
</div>
<!-- Right: Bookmark Icon -->
<button aria-label="Bookmark Welcome Introduction" class="text-slate-400 hover:text-slate-600 p-1.5 shrink-0" type="button">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</article>
<!-- END: SessionCard2 -->
<!-- BEGIN: SessionCard3 -->
<article data-day="1" data-agenda-category="Nutrition" data-session="pediatric-nutrition" class="bg-white rounded-2xl p-3.5 border border-slate-100 shadow-[0_4px_16px_rgba(0,0,0,0.04)] flex items-center justify-between relative group hover:shadow-md transition">
<!-- Left: Time Block -->
<div class="w-14 flex flex-col items-start pr-1 shrink-0">
<span class="text-[#0052cc] font-extrabold text-[15px] leading-tight">10:30</span>
<span class="text-slate-400 text-[10px] font-bold mt-0.5 tracking-wider uppercase">AM</span>
</div>
<!-- Middle-Left: Icon Badge (Nutrition / Lotus Plant) -->
<div class="w-11 h-11 rounded-2xl bg-[#e0f2fe] flex items-center justify-center shrink-0 mr-3">
<svg class="w-5 h-5 text-[#0284c7]" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 22C12 22 5 17 5 10C5 6.13 8.13 3 12 3C15.87 3 19 6.13 19 10C19 17 12 22 12 22ZM12 5C9.24 5 7 7.24 7 10C7 14.28 10.66 18.23 12 19.54C13.34 18.23 17 14.28 17 10C17 7.24 14.76 5 12 5Z" opacity="0.3"></path>
<path d="M12 16.5C10.62 16.5 9.5 15.38 9.5 14C9.5 12.62 12 9 12 9C12 9 14.5 12.62 14.5 14C14.5 15.38 13.38 16.5 12 16.5Z"></path>
</svg>
</div>
<!-- Middle-Right: Content Detail -->
<div class="flex-1 min-w-0 pr-2">
<span class="text-[10px] font-extrabold text-[#0062eb] tracking-wider uppercase block">NUTRITION</span>
<h4 class="text-[13px] font-bold text-[#091e42] leading-snug">Future of Pediatric Nutrition</h4>
<div class="flex items-center text-slate-400 text-[11px] font-medium mt-0.5 truncate">
<svg class="w-3 h-3 text-slate-400 mr-1 shrink-0" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="truncate">Dr. Sarah Johnson</span>
</div>
</div>
<!-- Right: Bookmark Icon -->
<button aria-label="Bookmark Pediatric Nutrition" class="text-slate-400 hover:text-slate-600 p-1.5 shrink-0" type="button">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</article>
<!-- END: SessionCard3 --><p data-agenda-empty class="detail-empty" role="status" hidden></p>
</div>
</div>
<!-- END: TodaySessionsContentSheet -->

</main>
<!-- END: PhoneContainer -->
</body></html>
