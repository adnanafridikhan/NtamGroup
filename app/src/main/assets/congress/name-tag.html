<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>My Name Tag - Nestlé Medical Congress 2026</title><link rel="stylesheet" href="name-tag.css">
<link rel="stylesheet" href="android.css"><script src="detail.js" defer></script>
<style data-purpose="background-patterns">
    /* Subtle wave line overlays on top dark navy background */
    .bg-wave-pattern {
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 180, 219, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 10%, rgba(19, 88, 219, 0.12) 0%, transparent 45%);
    }

    .monogram-ring {
      background: linear-gradient(135deg, #F8CD46 0%, #00d2ff 100%);
      padding: 3.5px;
      border-radius: 9999px;
    }

    .banner-gradient {
      background: linear-gradient(90deg, #00C6FF 0%, #0072FF 100%);
    }

    /* Soft shadow on the main card */
    .badge-card-shadow {
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.25), 0 20px 40px -10px rgba(2, 12, 28, 0.5);
    }
  </style>
<style data-purpose="ios-frame-styling">
    /* Device frame wrapper for preview & mobile emulation */
    body {
      background-color: #030a16;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px 8px;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Hide scrollbars while allowing scroll inside screen */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="selection:bg-cyan-500 selection:text-white" data-screen="name-tag">
<!-- BEGIN: Mobile Device Frame -->
<div class="relative w-full max-w-[390px] h-[844px] bg-[#041633] text-white rounded-[50px] border-[10px] border-[#1f2735] shadow-[0_25px_60px_rgba(0,0,0,0.8)] overflow-hidden flex flex-col justify-between select-none">

<!-- BEGIN: Header & Top Navigation -->
<nav aria-label="Screen Navigation" class="relative z-20 px-5 pt-3 pb-4 flex items-center justify-between">

<button aria-label="Go back" class="w-10 h-10 rounded-2xl bg-white/10 hover:bg-white/20 active:scale-95 transition flex items-center justify-center backdrop-blur-md text-white border border-white/10" type="button">
<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>

<h1 class="text-xl font-bold tracking-tight text-white">My Name Tag</h1>

</svg>
</button>
</nav>

<!-- END: Header & Top Navigation -->

<p class="text-xs uppercase font-extrabold tracking-wider text-white drop-shadow-sm">Nestlé Medical</p>
<p class="text-sm font-black uppercase tracking-wider text-amber-300 drop-shadow">Congress 2026</p>

<span class="text-2xl font-black text-[#1358db] tracking-tight">HL</span>
</div>
</div>
</div>
<!-- Attendee Name & Title Details -->
<section class="text-center" data-purpose="attendee-title">
<h2 class="text-2xl font-extrabold text-[#0C2340] tracking-tight">Huda Latheef</h2>

<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<rect height="18" rx="2" stroke-linecap="round" width="18" x="3" y="4"></rect>
<line stroke-linecap="round" x1="16" x2="16" y1="2" y2="6"></line>

</main>

</div>

</body></html>
